name: Compiler tests

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: compiler-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - uses: actions/cache@v4
        with:
          path: target/toolchains/llvm/downloads
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/llvm.json') }}
      - run: cargo llvm fetch
      - name: Prepare shared test binaries and runner once
        id: prepare
        run: |
          cargo test -p bray-compilation --no-run
          cargo build --release --bin xtask
      - name: Report fast compiler reference timing
        run: cargo xtask test compiler
      - name: Run all slow tiers in deterministic parallel shards
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          status=0
          for tier in native proof exhaustive; do
            processes=()
            for shard in 1 2 3 4; do
              cargo xtask test compiler --tier "$tier" --shard "$shard/4" &
              processes+=("$!")
            done
            for process in "${processes[@]}"; do
              wait "$process" || status=1
            done
          done
          exit "$status"
      - name: Retain selection, timing, phase, and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-test-reports
          path: target/compiler-tests/
          if-no-files-found: error
