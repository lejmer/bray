[workspace]
members = [
    "crates/bray-base",
    "crates/bray-binder",
    "crates/bray-bound-tree",
    "crates/bray-checker",
    "crates/bray-codegen",
    "crates/bray-codegen-llvm",
    "crates/bray-compilation",
    "crates/bray-compiler-known",
    "crates/bray-declarations",
    "crates/bray-diagnostics",
    "crates/bray-driver",
    "crates/bray-emitter",
    "crates/bray-formatter",
    "crates/brayfmt",
    "crates/bray-runtime-abi",
    "crates/bray-runtime-adapter",
    "crates/bray-runtime-interface",
    "crates/bray-runtime-model",
    "crates/bray-ir",
    "crates/bray-linker",
    "crates/bray-lsp",
    "crates/bray-lowering",
    "crates/bray-messages",
    "crates/bray-native-artifact",
    "crates/bray-package-interface",
    "crates/bray-parser",
    "crates/bray-platform",
    "crates/bray-platform-abi",
    "crates/bray-platform-abi-support",
    "crates/bray-platform-abi-temporal",
    "crates/bray-project",
    "crates/bray-profile",
    "crates/bray-runtime",
    "crates/bray-source",
    "crates/bray-standard-library",
    "crates/bray-symbols",
    "crates/bray-syntax",
    "crates/bray-target",
    "crates/bray-test-protocol",
    "crates/bray-testing",
    "crates/bray-tooling",
    "crates/bray",
    "crates/brayc",
    "tools/rust-style",
    "tools/llvm-toolchain",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.0.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
