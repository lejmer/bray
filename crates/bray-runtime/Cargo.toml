[package]
name = "bray-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
test-host = ["dep:bray-source", "dep:bray-test-protocol"]

[dependencies]
bray-platform = { path = "../bray-platform" }
bray-platform-abi = { path = "../bray-platform-abi" }
bray-runtime-abi = { path = "../bray-runtime-abi" }
bray-runtime-model = { path = "../bray-runtime-model" }
bray-source = { path = "../bray-source", optional = true }
bray-test-protocol = { path = "../bray-test-protocol", optional = true }

[dev-dependencies]
bray-testing = { path = "../bray-testing" }

[lints]
workspace = true
