[package]
name = "bray-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-compilation = { path = "../bray-compilation" }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-messages = { path = "../bray-messages" }
bray-source = { path = "../bray-source" }

# `std` supports process arguments and paths, `derive` keeps the typed CLI shape
# colocated with the clap boundary.
clap = { version = "4", default-features = false, features = ["derive", "std"] }
# `derive` keeps the driver JSON output contract explicit in local DTOs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
