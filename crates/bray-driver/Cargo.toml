[package]
name = "bray-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-compilation = { path = "../bray-compilation" }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-messages = { path = "../bray-messages" }
bray-parser = { path = "../bray-parser" }
bray-source = { path = "../bray-source" }
bray-symbols = { path = "../bray-symbols" }
bray-syntax = { path = "../bray-syntax" }

# `std` supports process arguments and paths, `derive` keeps the typed CLI shape
# colocated with the clap boundary, `help`/`usage` let clap render the compiler
# help view, and `color` lets the driver apply its terminal palette to clap
# output.
clap = { version = "4", default-features = false, features = ["color", "derive", "help", "std", "usage"] }

# `derive` keeps the driver JSON output contract explicit in local DTOs.
serde = { version = "1", features = ["derive"] }

serde_json = "1"

[lints]
workspace = true
