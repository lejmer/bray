[package]
name = "bray-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-base = { path = "../bray-base" }
bray-compilation = { path = "../bray-compilation" }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-emitter = { path = "../bray-emitter" }
bray-messages = { path = "../bray-messages" }
bray-package-interface = { path = "../bray-package-interface" }
bray-runtime-interface = { path = "../bray-runtime-interface" }
bray-source = { path = "../bray-source" }
bray-standard-library = { path = "../bray-standard-library" }
bray-symbols = { path = "../bray-symbols" }
bray-target = { path = "../bray-target" }
bray-test-protocol = { path = "../bray-test-protocol" }
bray-tooling = { path = "../bray-tooling" }

# `std` supports process arguments and paths, `derive` keeps the typed CLI shape
# colocated with the clap boundary, `help`/`usage` let clap render the compiler
# help view, and `color` lets the driver apply its terminal palette to clap
# output.
clap = { version = "4", default-features = false, features = ["color", "derive", "help", "std", "usage"] }

# `derive` keeps the driver JSON output contract explicit in local DTOs.
serde = { version = "1", features = ["derive"] }

serde_json = "1"

[dev-dependencies]
bray-profile = { path = "../bray-profile" }
bray-testing = { path = "../bray-testing", features = ["mir-unit"] }

[lints]
workspace = true
