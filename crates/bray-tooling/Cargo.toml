[package]
name = "bray-tooling"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-bound-tree = { path = "../bray-bound-tree" }
bray-codegen = { path = "../bray-codegen" }
bray-codegen-llvm = { path = "../bray-codegen-llvm" }
bray-compilation = { path = "../bray-compilation" }
bray-declarations = { path = "../bray-declarations" }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-ir = { path = "../bray-ir" }
bray-linker = { path = "../bray-linker" }
bray-lowering = { path = "../bray-lowering" }
bray-messages = { path = "../bray-messages" }
bray-package-interface = { path = "../bray-package-interface" }
bray-parser = { path = "../bray-parser" }
bray-runtime-interface = { path = "../bray-runtime-interface" }
bray-source = { path = "../bray-source" }
bray-symbols = { path = "../bray-symbols" }
bray-syntax = { path = "../bray-syntax" }
bray-target = { path = "../bray-target" }

# Shared command surfaces use the same terminal palette and typed output mode.
clap = { version = "4", default-features = false, features = ["color", "std"] }

# Inspection and diagnostic reports use explicit local serialization DTOs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bray-testing = { path = "../bray-testing", features = ["mir-unit"] }

[lints]
workspace = true
