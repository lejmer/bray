[package]
name = "bray-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bound-unit = [
    "dep:bray-bound-tree",
    "dep:bray-declarations",
    "dep:bray-parser",
    "dep:bray-symbols",
]
mir-unit = [
    "bound-unit",
    "dep:bray-ir",
    "dep:bray-runtime-interface",
    "dep:bray-target",
]

[dependencies]
bray-bound-tree = { path = "../bray-bound-tree", optional = true }
bray-declarations = { path = "../bray-declarations", optional = true }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-ir = { path = "../bray-ir", optional = true }
bray-messages = { path = "../bray-messages" }
bray-parser = { path = "../bray-parser", optional = true }
bray-runtime-interface = { path = "../bray-runtime-interface", optional = true }
bray-source = { path = "../bray-source" }
bray-symbols = { path = "../bray-symbols", features = ["test-support"], optional = true }
bray-syntax = { path = "../bray-syntax" }
bray-target = { path = "../bray-target", features = ["test-support"], optional = true }
clap = { version = "4", default-features = false, features = ["std"] }

[lints]
workspace = true
