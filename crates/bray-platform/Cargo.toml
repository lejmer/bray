[package]
name = "bray-platform"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
default = [
    "clock",
    "contract",
    "entropy",
    "event",
    "memory",
    "network",
    "process",
    "thread",
]
clock = []
contract = []
entropy = ["dep:getrandom"]
event = ["clock", "dep:mio"]
memory = ["dep:memmap2"]
network = ["dep:mio"]
process = []
test-output = []
thread = []

[dependencies]
getrandom = { version = "0.4.3", optional = true }
memmap2 = { version = "0.9.11", optional = true }
mio = { version = "1.2.2", features = ["net", "os-poll"], optional = true }

[lints]
workspace = true
