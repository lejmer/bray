[package]
name = "bray-native-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-base = { path = "../bray-base" }
bray-symbols = { path = "../bray-symbols" }
bray-target = { path = "../bray-target" }
object = { version = "=0.39.1", default-features = false, features = ["read", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["write", "std"] }
tempfile = "3"

[lints]
workspace = true
