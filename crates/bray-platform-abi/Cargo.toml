[package]
name = "bray-platform-abi"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
build = "build/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["temporal", "dynamic"]
temporal = ["dep:bray-platform-abi-temporal"]
dynamic = []

[dependencies]
bray-platform-abi-temporal = { path = "../bray-platform-abi-temporal", optional = true }

[dev-dependencies]
bray-runtime-abi = { path = "../bray-runtime-abi" }

[build-dependencies]
bray-runtime-abi = { path = "../bray-runtime-abi" }
cc = "1.2.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[lints]
workspace = true
