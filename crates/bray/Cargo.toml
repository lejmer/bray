[package]
name = "bray"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-compilation = { path = "../bray-compilation" }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-emitter = { path = "../bray-emitter" }
bray-formatter = { path = "../bray-formatter" }
bray-package-interface = { path = "../bray-package-interface" }
bray-platform = { path = "../bray-platform" }
bray-project = { path = "../bray-project" }
bray-source = { path = "../bray-source" }
bray-symbols = { path = "../bray-symbols" }
bray-target = { path = "../bray-target" }
bray-tooling = { path = "../bray-tooling" }

# `std` supports process arguments and paths, `derive` keeps the typed CLI
# shape colocated with the Tack boundary, and help/color features render the
# user-facing command surface.
clap = { version = "4", default-features = false, features = ["color", "derive", "help", "std", "usage"] }

# Project inspection and diagnostic output use explicit serialization DTOs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bray-testing = { path = "../bray-testing" }

[lints]
workspace = true

[[bin]]
name = "bray"
path = "src/main.rs"
