[package]
name = "bray"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bray-base = { path = "../bray-base" }
bray-diagnostics = { path = "../bray-diagnostics" }
bray-emitter = { path = "../bray-emitter" }
bray-messages = { path = "../bray-messages" }
bray-platform = { path = "../bray-platform" }
bray-profile = { path = "../bray-profile" }
bray-project = { path = "../bray-project" }
bray-source = { path = "../bray-source" }
bray-standard-library = { path = "../bray-standard-library" }
bray-symbols = { path = "../bray-symbols" }
bray-target = { path = "../bray-target" }
bray-test-protocol = { path = "../bray-test-protocol", features = ["serialization"] }
bray-tooling = { path = "../bray-tooling", default-features = false, features = ["analysis", "build-identity"] }

# `std` supports process arguments and paths, `derive` keeps the typed CLI
# shape colocated with the Tack boundary, `error-context` identifies invalid
# arguments, and help/color features render the user-facing command surface.
clap = { version = "4", default-features = false, features = ["color", "derive", "error-context", "help", "std", "usage"] }

# Coordinated progress bars keep package work stable while compiler processes run.
indicatif = "0.18.6"

# Native test hosts exchange bounded results through securely created temporary files.
tempfile = "3"

# Bray Tack turns terminal interrupts into cooperative test-command cancellation.
ctrlc = "3"

# Project inspection and diagnostic output use explicit serialization DTOs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bray-driver = { path = "../bray-driver" }
bray-testing = { path = "../bray-testing" }

[lints]
workspace = true

[[bin]]
name = "bray"
path = "src/main.rs"
