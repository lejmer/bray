[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bray-base = { path = "../crates/bray-base" }
bray-llvm-toolchain = { path = "../tools/llvm-toolchain" }
bray-codegen = { path = "../crates/bray-codegen" }
bray-compilation = { path = "../crates/bray-compilation" }
bray-compiler-known = { path = "../crates/bray-compiler-known", features = ["generation"] }
bray-diagnostics = { path = "../crates/bray-diagnostics" }
bray-driver = { path = "../crates/bray-driver" }
bray-emitter = { path = "../crates/bray-emitter" }
bray-formatter = { path = "../crates/bray-formatter" }
bray-linker = { path = "../crates/bray-linker" }
bray-package-interface = { path = "../crates/bray-package-interface" }
bray-profile = { path = "../crates/bray-profile" }
bray-project = { path = "../crates/bray-project" }
bray-runtime-abi = { path = "../crates/bray-runtime-abi" }
bray-runtime-interface = { path = "../crates/bray-runtime-interface" }
bray-source = { path = "../crates/bray-source" }
bray-standard-library = { path = "../crates/bray-standard-library" }
bray-symbols = { path = "../crates/bray-symbols" }
bray-target = { path = "../crates/bray-target" }
bray-test-protocol = { path = "../crates/bray-test-protocol", features = ["serialization"] }
bray-tooling = { path = "../crates/bray-tooling" }
rust-style = { path = "../tools/rust-style" }
quote = "1"
rayon = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
unicode-width = "0.2"

[dev-dependencies]
bray-package-interface = { path = "../crates/bray-package-interface", features = ["test-support"] }

[target.'cfg(not(windows))'.dependencies]
inkwell = { version = "=0.9.0", default-features = false, features = ["llvm22-1-prefer-static"] }

[target.'cfg(windows)'.dependencies]
inkwell = { version = "=0.9.0", default-features = false, features = ["llvm22-1-no-llvm-linking"] }

[[bin]]
name = "xtask"
path = "src/main.rs"
