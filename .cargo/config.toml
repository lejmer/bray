[build]
build-dir = "{workspace-root}/target/cargo"

[alias]
llvm = "run --package bray-llvm-toolchain --release --"
xtask = "run --bin xtask --release --"
xtask-incremental = "run --bin xtask --profile tooling --"
bray-incremental = "run --bin bray --profile tooling --"
brayc-incremental = "run --bin brayc --profile tooling --"

[env]
BRAY_LLVM_PREFIX = { value = "target/toolchains/llvm/active", relative = true }
# The upstream llvm-sys build script owns this compatibility name.
LLVM_SYS_221_PREFIX = { value = "target/toolchains/llvm/active", relative = true }
